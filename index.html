<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিদ্যুৎ মিটার রিচার্জ এসিস্ট্যান্ট</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h2 { text-align: center; color: #1a365d; font-size: 1.5rem; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button#startBtn {
            width: 100%;
            padding: 15px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .token-line {
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s ease;
        }
        .token-line.active { border-color: #2b6cb0; background-color: #f0f7ff; }
        .token-line.locked { filter: blur(5px); pointer-events: none; opacity: 0.3; }
        .token-line.completed { background-color: #e2e8f0; border-color: #cbd5e0; pointer-events: none; opacity: 0.3; }
        .token-line.completed::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #ef4444;
            z-index: 10;
        }
        .digits-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .digit {
            font-size: 1.8rem;
            font-weight: bold;
            width: 45px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            color: #2d3748;
        }
        .separator { font-size: 1.5rem; color: #a0aec0; align-self: center; }
        .line-info { text-align: center; font-weight: bold; margin-bottom: 10px; color: #4a5568; }
        #actionSection { display: none; position: sticky; bottom: 10px; width: 100%; margin-top: 10px; z-index: 100; }
        #okBtn {
            width: 100%;
            padding: 15px;
            background-color: #38a169;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .success-msg { text-align: center; font-size: 1.2rem; font-weight: bold; color: #2f855a; }
        
        /* ফুটার এবং অ্যানিমেশন স্টাইল */
        footer {
            margin-top: auto;
            padding: 15px;
            text-align: center;
        }
        .dev-text {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            animation: glowText 4s infinite ease-in-out;
        }
        @keyframes glowText {
            0% { color: #4a5568; text-shadow: 0 0 0px rgba(43, 108, 176, 0); }
            50% { color: #2b6cb0; text-shadow: 0 0 8px rgba(43, 108, 176, 0.4); }
            100% { color: #4a5568; text-shadow: 0 0 0px rgba(43, 108, 176, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>মিটার 🚀 রিচার্জ</h2>
    <div id="inputSection">
        <textarea id="smsInput" placeholder="এখানে সম্পূর্ণ মেসেজ পেস্ট করুন..."></textarea>
        <button id="startBtn">টোকেন দেখুন </button>
    </div>
    <div id="tokenContainer"></div>
    <div id="actionSection">
        <button id="okBtn">OK - পরবর্তী টোকেন</button>
    </div>
</div>

<footer>
    <div class="dev-text">Devloper by Sjshakil</div>
</footer>

<script>
    let allTokensCount = 0, currentLineIndex = 0;
    const startBtn = document.getElementById('startBtn'), inputSection = document.getElementById('inputSection');
    const tokenContainer = document.getElementById('tokenContainer'), actionSection = document.getElementById('actionSection');
    const okBtn = document.getElementById('okBtn');

    startBtn.addEventListener('click', () => {
        const smsText = document.getElementById('smsInput').value;
        if (!smsText.trim()) return alert('সম্পূর্ণ মেসেজ পেস্ট করুন!');
        
        const tokenSection = smsText.includes("Token is") ? smsText.substring(smsText.indexOf("Token is")+8, smsText.indexOf("SquNo")).trim() : smsText;
        const lines = tokenSection.split(',').map(l => l.replace(/[^0-9]/g, '')).filter(l => l.length > 0);
        
        if (lines.length === 0) return alert("টোকেন পাওয়া যায়নি!");
        
        tokenContainer.innerHTML = '';
        currentLineIndex = 0; allTokensCount = lines.length;
        
        lines.forEach((lineStr, lIdx) => {
            const lineDiv = document.createElement('div');
            lineDiv.className = `token-line ${lIdx === 0 ? 'active' : 'locked'}`;
            lineDiv.id = `line-${lIdx}`;
            lineDiv.innerHTML = `<div class="line-info">টোকেন ${lIdx + 1} / ${allTokensCount}</div><div class="digits-grid"></div>`;
            const grid = lineDiv.querySelector('.digits-grid');
            
            for (let i = 0; i < lineStr.length; i++) {
                if (i > 0 && i % 4 === 0) grid.insertAdjacentHTML('beforeend', '<span class="separator">-</span>');
                grid.insertAdjacentHTML('beforeend', `<span class="digit">${lineStr[i]}</span>`);
            }
            tokenContainer.appendChild(lineDiv);
        });
        inputSection.style.display = 'none'; actionSection.style.display = 'block';
        updateButtonText();
    });

    okBtn.addEventListener('click', () => {
        document.getElementById(`line-${currentLineIndex}`).className = 'token-line completed';
        if (currentLineIndex < allTokensCount - 1) {
            currentLineIndex++;
            document.getElementById(`line-${currentLineIndex}`).className = 'token-line active';
            updateButtonText();
            document.getElementById(`line-${currentLineIndex}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            actionSection.style.display = 'none';
            tokenContainer.innerHTML += '<div class="success-msg">🎉 সব শেষ!<br><br><button onclick="location.reload()" style="padding:10px;">আবার শুরু করুন</button></div>';
        }
    });

    function updateButtonText() {
        okBtn.innerText = currentLineIndex === allTokensCount - 1 ? "শেষ - সম্পন্ন" : `OK - পরবর্তী (${currentLineIndex + 2})`;
        okBtn.style.backgroundColor = currentLineIndex === allTokensCount - 1 ? "#e53e3e" : "#38a169";
    }
</script>
</body>
</html>
